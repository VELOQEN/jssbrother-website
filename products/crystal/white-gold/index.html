<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1"
>

<title>
White Gold | JSS Brothers Lahore
</title>

<meta
 name="description"
 content="White Gold Crystal Metallic Yarn / Tilla supplied by JSS Brothers in Lahore."
>

<link
 rel="canonical"
 href="https://jssbrother.com/products/crystal/white-gold/"
>


<style>
*{box-sizing:border-box}

html{
 background:#08101d
}

body{
 margin:0;
 background:
 radial-gradient(
   circle at 80% 10%,
   rgba(37,99,235,.18),
   transparent 32%
 ),
 #08101d;
 color:#f7f9fc;
 font-family:Arial,Helvetica,sans-serif
}

a{
 color:inherit;
 text-decoration:none
}

.wrap{
 width:min(
   1240px,
   calc(100% - 40px)
 );
 margin:auto
}

header{
 min-height:84px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:
  1px solid rgba(255,255,255,.10)
}

.brand{
 font-size:19px;
 font-weight:900;
 letter-spacing:.08em
}

.back{
 padding:11px 17px;
 border:
  1px solid rgba(255,255,255,.18);
 border-radius:999px;
 font-size:12px
}

.product{
 display:grid;
 grid-template-columns:
  minmax(0,1.05fr)
  minmax(320px,.95fr);
 gap:45px;
 align-items:center;
 padding:60px 0 90px
}

.product-image{
 position:relative;
 overflow:hidden;
 border-radius:24px;
 border:
  1px solid rgba(255,255,255,.12);
 background:transparent;
 aspect-ratio:3/2;
 display:flex;
 align-items:center;
 justify-content:center;
}

.product-image
> img:not(.jss-approved-watermark){
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
 object-position:center;
 padding:6px;
}

.kicker{
 color:#7fb0ff;
 font-size:10px;
 letter-spacing:.18em;
 font-weight:800
}

h1{
 margin:10px 0 13px;
 font-size:clamp(46px,6vw,78px);
 line-height:.95;
 letter-spacing:-.055em
}

.sub{
 max-width:650px;
 color:rgba(255,255,255,.62);
 font-size:14px;
 line-height:1.7
}

.details{
 margin-top:28px;
 border-top:
  1px solid rgba(255,255,255,.12)
}

.row{
 display:flex;
 justify-content:space-between;
 gap:30px;
 padding:15px 0;
 border-bottom:
  1px solid rgba(255,255,255,.08);
 font-size:12px
}

.row span{
 color:rgba(255,255,255,.52)
}

@media(max-width:850px){

 .product{
  grid-template-columns:1fr
 }

}

@media(max-width:580px){

 .wrap{
  width:min(
    100% - 26px,
    1240px
  )
 }

}
</style>


</head>

<body>

<header class="wrap">

<a
 class="brand"
 href="/"
>
JSS BROTHERS
</a>

<a
 class="back"
 href="/products/crystal/"
>
← Back
</a>

</header>


<main class="wrap">

<section class="product">

<div class="product-image">

<img
 src="/images/products/metallic-yarn/crystal/WHITE GOLD CRYSTAL.webp"
 alt="White Gold - JSS Brothers"
>

</div>


<div class="product-copy">

<div class="kicker">
CRYSTAL METALLIC YARN / TILLA
</div>

<h1>
White Gold
</h1>

<div class="sub">
White Gold supplied by
JSS Brothers in Lahore.
</div>


<div class="details">

<div class="row">
<span>Product Family</span>
<strong>
Crystal Metallic Yarn
</strong>
</div>

<div class="row">
<span>Shade</span>
<strong>White Gold</strong>
</div>

<div class="row">
<span>Supplier</span>
<strong>JSS Brothers</strong>
</div>

<div class="row">
<span>Location</span>
<strong>Lahore, Pakistan</strong>
</div>

</div>

</div>

</section>

</main>

<script src="/branding-loader.js?v=3"></script>

</body>

</html>
