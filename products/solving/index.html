<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solving | JSS Brothers</title>
<meta name="description" content="Explore Solving in the JSS Brothers product catalogue.">
<link rel="canonical" href="https://jssbrother.com/products/solving/">

<style id="jss-unified-catalogue">
*{box-sizing:border-box}

html{
  background:#08101d;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 80% 10%,rgba(37,99,235,.18),transparent 32%),
    #08101d;
  color:#f7f9fc;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:min(1240px,calc(100% - 40px));
  margin:auto;
}

header{
  min-height:84px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.10);
}

.brand{
  font-size:19px;
  font-weight:900;
  letter-spacing:.08em;
}

.back{
  padding:11px 17px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  font-size:12px;
}

.hero{
  padding:70px 0 45px;
}

.kicker{
  color:#7fb0ff;
  font-size:10px;
  letter-spacing:.18em;
  font-weight:800;
  text-transform:uppercase;
}

h1{
  margin:10px 0 13px;
  font-size:clamp(42px,6vw,76px);
  line-height:.95;
  letter-spacing:-.055em;
}

.sub{
  max-width:650px;
  color:rgba(255,255,255,.62);
  font-size:14px;
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
  padding-bottom:80px;
}

.section-title{
  grid-column:1/-1;
  margin:16px 0 3px;
  padding:0 2px 17px;
  border-bottom:1px solid rgba(255,255,255,.10);
}

.section-title:first-child{
  margin-top:0;
}

.section-title small{
  display:block;
  color:#7fb0ff;
  font-size:9px;
  letter-spacing:.16em;
  margin-bottom:7px;
}

.section-title strong{
  font-size:25px;
}

.card{
  overflow:hidden;
  border:1px solid rgba(255,255,255,.11);
  border-radius:20px;
  background:rgba(255,255,255,.035);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  background:rgba(255,255,255,.06);
}

.image{
  aspect-ratio:1.22/1;
  background:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.image img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
  padding:8px;
}

.info{
  padding:19px 20px 22px;
}

.info small{
  display:block;
  color:#7fb0ff;
  font-size:9px;
  letter-spacing:.12em;
  margin-bottom:10px;
  text-transform:uppercase;
}

.info strong{
  font-size:21px;
}

.info p{
  color:rgba(255,255,255,.52);
  font-size:11px;
  margin:8px 0 0;
}

.coming{
  grid-column:1/-1;
  min-height:280px;
  border:1px dashed rgba(127,176,255,.30);
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(255,255,255,.025);
  padding:40px;
}

.coming strong{
  display:block;
  font-size:32px;
}

.coming p{
  color:rgba(255,255,255,.55);
  line-height:1.7;
  max-width:560px;
}

footer{
  border-top:1px solid rgba(255,255,255,.10);
  padding:30px 0;
  color:rgba(255,255,255,.50);
  font-size:11px;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:580px){
  .grid{
    grid-template-columns:1fr;
  }

  .wrap{
    width:min(100% - 26px,1240px);
  }
}
.featured-product{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.featured-product .image{aspect-ratio:auto;min-height:470px;background:#eef0f3}
.featured-product .image img{max-height:590px;object-fit:contain}
.featured-product .info{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,5vw,70px)}
.featured-product .info strong{font-size:clamp(30px,4vw,52px)}
@media(max-width:700px){.featured-product{grid-template-columns:1fr}.featured-product .image{min-height:340px}.featured-product .image img{max-height:440px}}
</style>

</head>

<body>

<header class="wrap">
  <a class="brand" href="/">JSS BROTHERS</a>
  <a class="back" href="/#catalogue">← Back to Materials</a>
</header>

<main class="wrap">

<section class="hero">
  <div class="kicker">SOLVING</div>
  <h1>Solving</h1>
  <div class="sub">Solving product image and details from JSS Brothers.</div>
</section>

<section class="grid">

<article class="card featured-product">
  <div class="image"><img src="/images/products/solving/solvi.webp" alt="Solving roll supplied by JSS Brothers" loading="lazy"></div>
  <div class="info"><small>SOLVING</small><strong>Solving</strong><p>100yrds</p></div>
</article>
</section>

</main>

<footer>
  <div class="wrap">
    © 2026 JSS Brothers · Since 2010 · 17 Years
  </div>
</footer>

<script src="/branding-loader.js?v=1"></script>
</body>
</html>
