<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WD40 | JSS Brothers</title>
<meta name="description" content="Explore WD40 in the JSS Brothers product catalogue.">
<link rel="canonical" href="https://jssbrother.com/products/spare-parts/wd40/">
<style>

:root{
  --ink:#0d2530;
  --muted:#64757c;
  --line:#dfe7e9;
  --paper:#f7f9f8;
  --white:#fff;
  --accent:#005f73;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--paper);
  color:var(--ink);
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:22px 5vw;
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:10;
}
.brand{
  font-weight:900;
  letter-spacing:.12em;
  text-decoration:none;
  color:var(--ink);
}
.back{
  text-decoration:none;
  color:var(--accent);
  font-weight:700;
}
.hero{
  padding:72px 5vw 42px;
  max-width:1450px;
  margin:auto;
}
.kicker{
  color:var(--accent);
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
}
h1{
  font-size:clamp(42px,7vw,92px);
  line-height:.92;
  margin:14px 0 20px;
  letter-spacing:-.05em;
}
.hero p{
  max-width:720px;
  font-size:18px;
  line-height:1.65;
  color:var(--muted);
}
.grid{
  max-width:1450px;
  margin:auto;
  padding:12px 5vw 80px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:22px;
}
.product-card{
  text-decoration:none;
  color:inherit;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease;
}
a.product-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 36px rgba(15,40,50,.10);
}
.product-image{
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eef2f2;
  overflow:hidden;
}
.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.product-info{
  padding:18px 18px 20px;
}
.product-info small{
  display:block;
  color:var(--accent);
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:7px;
  text-transform:uppercase;
}
.product-info strong{
  font-size:18px;
}
.coming{
  max-width:1450px;
  margin:auto;
  padding:20px 5vw 100px;
}
.coming-box{
  min-height:330px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
}
.coming-box strong{
  font-size:36px;
  margin-bottom:12px;
}
.coming-box p{
  color:var(--muted);
  max-width:560px;
  line-height:1.6;
}
footer{
  border-top:1px solid var(--line);
  padding:30px 5vw;
  color:var(--muted);
  background:#fff;
}
@media(max-width:1050px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .hero{padding-top:50px}
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}
}

.detail{
  max-width:1200px;
  margin:auto;
  padding:55px 5vw 100px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:50px;
  align-items:center;
}
.detail img{
  width:100%;
  border-radius:22px;
  border:1px solid var(--line);
  background:#fff;
}
.detail h1{font-size:clamp(42px,6vw,76px)}
.detail p{color:var(--muted);line-height:1.7}
@media(max-width:800px){
  .detail{grid-template-columns:1fr}
}
</style>

<style id="jss-dark-detail-fix">
html{
  background:#08101d !important;
}

body{
  background:
    radial-gradient(circle at 80% 10%,rgba(37,99,235,.18),transparent 32%),
    #08101d !important;
  color:#f7f9fc !important;
}

.topbar{
  background:rgba(8,16,29,.94) !important;
  border-bottom:1px solid rgba(255,255,255,.10) !important;
}

.brand{
  color:#f7f9fc !important;
}

.back,
.kicker{
  color:#7fb0ff !important;
}

.detail p,
.hero p{
  color:rgba(255,255,255,.62) !important;
}

.detail img{
  background:#fff !important;
  object-fit:contain !important;
  object-position:center !important;
}

footer{
  background:transparent !important;
  color:rgba(255,255,255,.50) !important;
  border-top:1px solid rgba(255,255,255,.10) !important;
}
</style>

</head>
<body>
<header class="topbar">
  <a class="brand" href="/">JSS BROTHERS</a>
  <a class="back" href="/products/spare-parts/">← Back</a>
</header>
<section class="detail">
  <div><img src="/images/products/spare-parts/wd40-spray.webp" alt="WD40 - JSS Brothers"></div>
  <div>
    <div class="kicker">Spare Parts</div>
    <h1>WD40</h1>
    <p>Available from JSS Brothers. Contact one of our branches for availability, pricing and further product information.</p>
  </div>
</section>
<footer>© 2026 JSS Brothers · Since 2010 · 17 Years</footer>
<script src="/branding-loader.js?v=1"></script>
</body>
</html>
